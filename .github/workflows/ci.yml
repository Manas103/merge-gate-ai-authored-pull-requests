name: CI

# Runs the same commands documented in the README's "Building and running" section. No
# measured number in this repository comes from a GitHub-hosted run of this workflow; every
# number in the README was measured locally, on the machine spec stated there. This workflow
# exists so the "GitHub Actions" claim in the stack line is a real, working CI configuration,
# not just a name on the page.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        working-directory: backend
        run: mvn -B test
      - name: real PIT mutation run
        working-directory: backend
        run: mvn -B org.pitest:pitest-maven:mutationCoverage

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: npm test
        working-directory: frontend
        run: npm test -- --run
      - name: npm run build
        working-directory: frontend
        run: npm run build
